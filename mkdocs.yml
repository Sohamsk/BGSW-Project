site_name: VB6 to C# Migration Tool
site_description: Documentation for the VB6 to C# Migration Tool
site_author: Project Team
site_url: https://sohamsk.github.io/BGSW-Project/
theme:
  name: material
  logo: images/logo.png
  palette:
    # Dark mode like React docs
    scheme: slate
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    # Enhanced navbar features
    - header.autohide  # Hide header on scroll
    - navigation.tabs.sticky  # Make tabs sticky
    - navigation.footer  # Add footer navigation
  icon:
    repo: fontawesome/brands/github
    # Add icons for navigation items
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
# Extensions for better looking docs
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      title: On this page
# Navigation structure with enhanced icons
nav:
  - Home: index.md
  - 📖 Documentation:
      - 🔍 Introduction: docs.md
      - ⚙️ Workflow: workflow.md
      - 🛠️ Steps to build: steps.md
      - 🚧 Pending components: pendingcomp.md
  - Credits: credit.md    
# Additional plugins for better functionality
plugins:
  - search
  - minify:
      minify_html: true
# Custom CSS for navbar enhancement
extra_css:
  - style.css

